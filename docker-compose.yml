services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repomind
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 5s
      timeout: 4s
      retries: 20
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://repomind:repomind@db:5432/repomind
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MAX_REPO_FILES: ${MAX_REPO_FILES:-250}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-512000}
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-20000000}
      CORS_ORIGINS: http://localhost:3000
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FASTAPI_INTERNAL_URL: http://api:8000
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  pgdata:
